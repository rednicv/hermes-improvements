[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-improvements"
version = "3.1.0"
description = "Architectural enhancement suite for Hermes Agent: vector memory, adaptive soul, and workflow classification."
readme = "README.md"
authors = [
    { name = "Hermes Contributor", email = "hermes-improvements@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vector = [
    "sentence-transformers>=2.2.0",
    "numpy>=1.20.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_improvements*"]
